name: Publish

# On a pull request: the indexes must be what scripts/build-extension-index.py makes of the packages. On main: the library goes
# to downloads.littlekeebo.app. scripts/publish.py uploads each new package version once under extensions/community/ and writes
# each shelf's index, signed with the shelf-community key, to feeds/community/. It runs in the publish environment (main only)
# as the community identity, which may write only under community/. Until the environment has its variables, publishing is
# skipped.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The indexes match the packages
        run: |
          python3 scripts/build-extension-index.py > /dev/null
          git diff --exit-code -- extensions/index.json phrases/index.json templates/index.json \
            || { echo "::error::An index is out of date: run python3 scripts/build-extension-index.py and commit it."; exit 1; }

  publish:
    name: publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    environment: publish
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      DOWNLOADS_STORAGE_ACCOUNT: ${{ vars.DOWNLOADS_STORAGE_ACCOUNT }}
      SHELF_SIGNING_KEY_ID: ${{ vars.SHELF_SIGNING_KEY_ID }}
    steps:
      - name: Check the publish environment
        id: ready
        run: |
          if [ -z "${AZURE_CLIENT_ID}" ] || [ -z "${DOWNLOADS_STORAGE_ACCOUNT}" ] || [ -z "${SHELF_SIGNING_KEY_ID}" ]; then
            echo "::notice::Publishing skipped. The publish environment has no AZURE_CLIENT_ID, DOWNLOADS_STORAGE_ACCOUNT or SHELF_SIGNING_KEY_ID yet."
            echo "ready=false" >> "${GITHUB_OUTPUT}"
          else
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          fi
      - if: steps.ready.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.ready.outputs.ready == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publish the community library
        if: steps.ready.outputs.ready == 'true'
        run: python3 scripts/publish.py --source community --account "${DOWNLOADS_STORAGE_ACCOUNT}" --key-id "${SHELF_SIGNING_KEY_ID}"
